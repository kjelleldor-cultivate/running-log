name: Garmin sync

on:
  schedule:
    - cron: "40 5 * * *"   # 05:40 UTC, every day
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to fetch (blank = 10, or 180 on first run)"
        required: false

permissions:
  contents: write

concurrency:
  group: garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install garminconnect cryptography
      - name: Fetch Garmin data
        env:
          GARMINTOKENS: ${{ secrets.GARMINTOKENS }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: python scripts/garmin_sync.py ${{ github.event.inputs.days }}
      - name: Commit
        run: |
          git config user.name "garmin-sync"
          git config user.email "actions@users.noreply.github.com"
          git add data/garmin.enc.json
          git diff --cached --quiet && exit 0
          git commit -m "Sync Garmin wellness data"
          git pull --rebase origin main
          git push
